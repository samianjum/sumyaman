
{% extends "hq_admin_custom/base.html" %}
{% block content %}
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white"><h4><i class="fas fa-users me-2"></i>Family Payment</h4></div>
        <div class="card-body">
            <p class="text-muted">Enter father's CNIC/B-Form to pay for all children at once.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100">Pay Now</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% extends "hq_admin_custom/base.html" %}
{% load static %}
{% block content %}
<div class="container-fluid p-4">
    <h2 class="fw-bold mb-4"><i class="fas fa-chart-line me-2 text-primary"></i>Fee Analytics Dashboard</h2>
    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white fw-bold">Monthly Collection Trend</div>
                <div class="card-body">
                    <canvas id="collectionChart" height="200"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">Top Defaulters</div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush" id="defaulterList">
                        <li class="list-group-item text-muted">Loading...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <div class="row mt-4">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">Bulk Actions</div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <button class="btn btn-primary w-100" onclick="window.location.href='{% url 'export_fee_data' school_slug %}?type=collection&format=csv'">
                                <i class="fas fa-file-csv me-2"></i>Export CSV
                            </button>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-success w-100" onclick="window.location.href='{% url 'export_fee_data' school_slug %}?type=collection&format=xlsx'">
                                <i class="fas fa-file-excel me-2"></i>Export Excel
                            </button>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-warning w-100" id="sendRemindersBtn">
                                <i class="fas fa-envelope me-2"></i>Send Reminders
                            </button>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-info w-100" id="generateInvoicesBtn">
                                <i class="fas fa-file-invoice me-2"></i>Bulk Invoices
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    fetch('/s/{{ school_slug }}/fee/analytics/')
        .then(res => res.json())
        .then(data => {
            new Chart(document.getElementById('collectionChart'), {
                type: 'line',
                data: { labels: data.months, datasets: [{ label: 'Collection (₹)', data: data.amounts, borderColor: '#0d6efd', fill: false }] }
            });
            let defList = document.getElementById('defaulterList');
            defList.innerHTML = data.defaulters.map(d => `<li class="list-group-item d-flex justify-content-between"><span>${d.name} (${d.roll})</span><span class="text-danger">₹${d.pending}</span></li>`).join('');
        });
    document.getElementById('sendRemindersBtn').addEventListener('click', () => {
        let studentIds = Array.from(document.querySelectorAll('input[name="student_ids"]:checked')).map(cb => cb.value);
        fetch('/s/{{ school_slug }}/fee/send-reminders/', { method: 'POST', headers: { 'X-CSRFToken': '{{ csrf_token }}' }, body: new URLSearchParams({ student_ids: studentIds }) })
            .then(() => alert('Reminders sent'));
    });
</script>
{% endblock %}

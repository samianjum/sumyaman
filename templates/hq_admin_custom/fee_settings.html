{% extends 'hq_admin_custom/base.html' %}
{% block content %}
<div class="container-fluid py-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fas fa-sliders-h me-2"></i>Fee Automation Settings</h5>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    {% for field in form %}
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">{{ field.label }}</label>
                            {{ field }}
                            <small class="text-muted">{{ field.help_text }}</small>
                        </div>
                    {% endfor %}
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card mt-4 shadow-sm">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0"><i class="fas fa-calendar-plus me-2"></i>Manual Fee Generation</h5>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <select id="gen_month" class="form-select">
                        {% for m in months %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="number" id="gen_year" class="form-control" value="2026">
                </div>
                <div class="col-md-3">
                    <button id="previewBtn" class="btn btn-info">Preview</button>
                    <button id="generateBtn" class="btn btn-success">Generate Now</button>
                </div>
            </div>
            <div id="previewResult" class="mt-3"></div>
        </div>
    </div>
</div>
<script>
    document.getElementById('previewBtn').addEventListener('click', function() {
        let month = document.getElementById('gen_month').value;
        let year = document.getElementById('gen_year').value;
        fetch(`/s/{{ school_slug }}/fee/generate-preview/${year}/${month}/`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('previewResult').innerHTML = `<div class="alert alert-info">Would create ${data.would_create} new fee records.</div>`;
            });
    });
    document.getElementById('generateBtn').addEventListener('click', function() {
        let month = document.getElementById('gen_month').value;
        let year = document.getElementById('gen_year').value;
        if(confirm('Generate fees for this month? This may create many records.')) {
            window.location.href = `/s/{{ school_slug }}/fee/generate/${year}/${month}/`;
        }
    });
</script>
{% endblock %}

{% for row in structure %}
<tr>
    <td class="ps-4">
        <span class="badge {% if row.wing == 'Boys' %}bg-primary{% else %}bg-danger{% endif %}-soft {% if row.wing == 'Boys' %}text-primary{% else %}text-danger{% endif %} px-3">
            {{ row.wing|upper }}
        </span>
    </td>
    <td class="fw-bold">Class {{ row.class }}</td>
    <td><span class="badge bg-light text-dark border px-3">Sec {{ row.section }}</span></td>
    <td class="text-end pe-4">
        <a href="/hq-portal/exams/{{ exam.id }}/class/{{ row.class }}/" class="btn btn-outline-dark btn-sm px-4 fw-bold" style="border-radius: 8px;">
            <i class="fas fa-external-link-alt me-1"></i> VIEW RESULT
        </a>
    </td>
</tr>
{% empty %}
<tr><td colspan="4" class="text-center py-4 text-muted">No matching results found.</td></tr>
{% endfor %}

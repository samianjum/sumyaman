
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8"><title>Super Admin | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .school-card { transition: transform 0.2s; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .school-card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .logo-box { width: 60px; height: 60px; border-radius: 12px; background: rgba(59, 130, 246, 0.1); display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-dark bg-primary px-4 mb-5 shadow">
    <span class="navbar-brand fw-bold">SUMYAMAN PRO <small class="ms-2 opacity-50">HQ</small></span>
    <div class="d-flex gap-2">
        <a href="{% url 'create_school' %}" class="btn btn-light btn-sm fw-bold">+ New School</a>
        
        <form action="{% url 'super_admin_logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">
                <i class="fas fa-power-off"></i>
            </button>
        </form>
    
    </div>
</nav>

<div class="container">
    <h4 class="mb-4 fw-bold text-secondary">Active Institutions</h4>
    <div class="row g-4">
        {% for school in schools %}
        <div class="col-md-4">
            <div class="card school-card bg-secondary-subtle" onclick="location.href='{% url 'school_detail' school.slug %}'">
                <div class="card-body d-flex align-items-center">
                    <div class="logo-box me-3">
                        {% if school.logo %}<img src="{{ school.logo.url }}" class="rounded shadow-sm" style="width:100%; height:100%; object-fit:cover;">
                        {% else %}<i class="fas fa-university fa-lg text-primary"></i>{% endif %}
                    </div>
                    <div>
                        <h6 class="mb-0 fw-bold">{{ school.name }}</h6>
                        <small class="text-muted">/s/{{ school.slug }}</small>
                    </div>
                    <i class="fas fa-chevron-right ms-auto text-muted"></i>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
</body></html>
